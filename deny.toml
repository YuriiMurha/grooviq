# cargo-deny 0.22.1: https://embarkstudios.github.io/cargo-deny/checks/cfg.html
[graph]
all-features = true

[advisories]
# No ignored advisories. Vulnerabilities fail with cargo-deny's default policy.
ignore = []

[licenses]
include-dev = true
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BlueOak-1.0.0", "CC-BY-4.0", "BSD-1-Clause", "BSD-2-Clause", "BSD-3-Clause", "0BSD", "ISC",
    "MPL-2.0", "Zlib", "Unicode-3.0", "Unicode-DFS-2016",
    "LGPL-2.1-only", "LGPL-2.1-or-later", "LGPL-3.0-only", "LGPL-3.0-or-later",
    "GPL-2.0-or-later", "GPL-3.0-only", "GPL-3.0-or-later",
    "OFL-1.1",
]
confidence-threshold = 0.8
