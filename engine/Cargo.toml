[package]
name = "grooviq-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Real-time audio engine: lock-free commands, fixed 64-frame blocks, NaN guard, panic isolation, offline rendering"

[lib]
name = "grooviq_engine"

[features]
# Commands that make the synth output NaN or panic, for the audio-health tests. Never on in the app.
test-hooks = []

[dependencies]
cpal = "0.18.2"
grooviq-dsp = { path = "../dsp" }
rtrb = "0.3"
# Pure-Rust maths: the same bits on every platform (clippy.toml bans the std methods).
libm = "0.2"
getrandom = "0.4"
tungstenite = "0.30"
# WAV export (Apache-2.0).
hound = "3"
# Sample files (MPL-2.0): only the containers and codecs a sampler opens, plus ID3 tags so an
# MP3 with large cover art (past the probe's 1 MB byte scan) still opens.
symphonia = { version = "0.6", default-features = false, features = ["wav", "aiff", "pcm", "flac", "mp3", "ogg", "vorbis", "id3v1", "id3v2"] }

# An output's transport type (Bluetooth, built-in, HDMI...), which cpal does not expose, and the
# thread CoreAudio notifies on (`AudioHardwareDeprecated` holds kAudioHardwarePropertyRunLoop):
# the same CoreAudio bindings cpal itself uses, with features it enables too, so no new crates.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "AudioHardwareDeprecated"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }

[dev-dependencies]
# Without the default `disable_release`, the allocation check also runs in release test builds.
assert_no_alloc = { version = "1.1", default-features = false }
tempfile = "3"

[[test]]
name = "panic"
required-features = ["test-hooks"]
