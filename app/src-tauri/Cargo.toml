[package]
name = "grooviq-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "The Grooviq desktop app: the Tauri shell around the engine"

[features]
profiling = ["grooviq-engine/profiling"]
qa-driver = []

[lib]
name = "grooviq_app"

[[bin]]
name = "grooviq"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
grooviq-dsp = { path = "../../dsp" }
grooviq-engine = { path = "../../engine" }
grooviq-project = { path = "../../project" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
# Open and save dialogs for projects, samples and exports (MIT OR Apache-2.0).
tauri-plugin-dialog = "2"
# MIDI keyboards: lists and opens the system's MIDI inputs (MIT).
midir = "0.11"

# Native window and application APIs use the same Objective-C bindings as Tauri (MIT).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# The panic-hook test makes the engine panic while rendering. Dev-only: never in the app.
grooviq-engine = { path = "../../engine", features = ["test-hooks"] }

[[test]]
name = "panic_hook"
