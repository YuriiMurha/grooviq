[package]
name = "grooviq-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "The Grooviq desktop app: the Tauri shell around the engine"

[lib]
name = "grooviq_app"

[[bin]]
name = "grooviq"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
grooviq-engine = { path = "../../engine" }
grooviq-project = { path = "../../project" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
# Open and save dialogs for projects, samples and exports (MIT OR Apache-2.0).
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
# The panic-hook test makes the engine panic while rendering. Dev-only: never in the app.
grooviq-engine = { path = "../../engine", features = ["test-hooks"] }

[[test]]
name = "panic_hook"
