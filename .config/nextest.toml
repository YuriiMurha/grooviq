[profile.ci]
fail-fast = false
retries = 0
# The longest debug tests can take about 160 seconds on CI.
slow-timeout = { period = "60s", terminate-after = 6 }

[profile.ci.junit]
path = "junit.xml"

[test-groups.wall-clock]
max-threads = 1

[[profile.ci.overrides]]
filter = '''
  (binary_id(=grooviq-engine::stream) & (
    test(=produces_fresh_frames_while_the_calling_thread_is_blocked) |
    test(=a_reconnecting_client_is_served) |
    test(=a_stalled_handshake_is_cut_off) |
    test(=dropping_the_server_ends_every_client_quickly) |
    test(=a_trickling_handshake_is_cut_off_at_the_deadline) |
    test(=dropping_the_server_while_a_handshake_trickles_is_quick) |
    test(=real_socket_makes_bounded_progress_at_the_requested_rate) |
    test(=the_rate_is_clamped)
  )) |
  (binary_id(=grooviq-engine::output) & (
    test(=selecting_a_device_switches_at_once) |
    test(=a_stream_that_keeps_failing_is_retried_later_and_quietly) |
    test(=an_open_failure_is_reported_once_and_retried_with_back_off) |
    test(=a_slow_open_does_not_hold_up_outputs_current_or_select) |
    test(=a_stream_error_prompts_a_check_before_the_next_poll) |
    test(=the_poll_follows_a_change_on_its_own) |
    test(=a_stale_failure_with_no_device_does_not_spin_the_poll_thread) |
    test(=dropping_the_output_closes_the_stream_and_ends_its_thread)
  )) |
  (binary_id(=grooviq-engine::null_output) & (
    test(=the_silent_output_renders_and_never_runs_ahead_of_the_clock) |
    test(=the_silent_output_moves_the_transport_and_the_meters) |
    test(=dropping_the_silent_output_stops_rendering_at_once)
  )) |
  (binary_id(=grooviq-engine) & (
    test(=output::backend::tests::control_handoff_waits_for_callback_claim_and_reclaims_on_control_thread) |
    test(=output::null_backend::tests::opening_again_replaces_the_stream_rather_than_adding_one) |
    test(=stream::tests::authenticated_never_reader_hits_write_deadline_and_releases_slot)
  )) |
  (binary_id(=grooviq-app) & (
    test(=commands::tests::two_quick_picks_save_the_output_that_plays) |
    test(=qa_driver::tests::slow_reader_does_not_renew_response_deadline)
  )) |
  (binary_id(=grooviq-app::midi) & test(=a_concurrent_last_release_cannot_cut_a_new_owner)) |
  (binary_id(=grooviq-project::file) & test(=load_does_not_even_open_the_path_the_project_names)) |
  (binary_id(=grooviq-project::notes) & test(=ten_thousand_notes_edit_in_under_50_ms)) |
  (binary_id(=grooviq-engine::export) & test(=export_is_faster_than_real_time)) |
  (binary_id(=grooviq-golden::song_m3) & test(=warmed_export_budget)) |
  (binary_id(=grooviq-dsp::synth_simd) & test(=denormal_tails_stay_fast))
'''
test-group = "wall-clock"
# The group serializes its own tests. Reserving all test threads keeps other groups out too.
threads-required = "num-test-threads"
# nextest starts tests in list order, so a member queued behind a long test would leave every
# other slot idle until it can run alone. Run the group first, before the pool fills.
priority = 100

# Start the longest tests next so they do not finish last on 3-core runners.
[[profile.ci.overrides]]
filter = 'binary_id(=grooviq-golden::song_m3) | binary_id(=grooviq-golden::character_delay) | binary_id(=grooviq-dsp::character_delay)'
priority = 50
