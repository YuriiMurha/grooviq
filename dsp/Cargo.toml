[package]
name = "grooviq-dsp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Built-in instruments and effects (ranges live in each device module's SPEC table)"

[lib]
name = "grooviq_dsp"

[dependencies]
# Pure-Rust exp/pow: the same bits on every platform (bit-identical golden renders).
libm = "0.2"

[dev-dependencies]
# Without the default `disable_release`, the allocation check also runs in release test builds.
assert_no_alloc = { version = "1.1", default-features = false }
# Micro-benchmarks of the inner loops (MIT OR Apache-2.0): `cargo bench -p grooviq-dsp`.
divan = "0.1.21"

[[bench]]
name = "kernels"
harness = false
