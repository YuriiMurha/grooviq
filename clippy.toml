# Determinism: exports must be byte-identical on every platform, so transcendental maths goes
# through `libm` (pure Rust) instead of the platform's libm. `sqrt` stays (IEEE exact).
# App-side display maths may opt out per item: #[allow(clippy::disallowed_methods, reason = "display only")].
disallowed-methods = [
    { path = "f32::exp", reason = "use libm: exports must be identical on every platform" },
    { path = "f32::exp2", reason = "use libm: exports must be identical on every platform" },
    { path = "f32::exp_m1", reason = "use libm: exports must be identical on every platform" },
