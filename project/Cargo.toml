[package]
name = "grooviq-project"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Grooviq project model, the .grooviq file format (zip with versioned JSON and embedded samples), atomic save, backups and the compile step to the engine's state"

[lib]
name = "grooviq_project"

[dependencies]
grooviq-dsp = { path = "../dsp" }
grooviq-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the deflate codec (project.json); samples are stored as they are.
zip = { version = "9.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
grooviq-engine = { path = "../engine", features = ["test-hooks"] }
tempfile = "3"

# A FIFO for a test, made without spawning a process (see `a_fifo_is_refused_without_blocking`).
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
