name: release

on:
  push:
    tags: ['v*']
  # Manual runs build CI artifacts only; they never create a tag or release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate version tag against app and lockfiles
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import json, os, pathlib, re, tomllib
          tag = os.environ["RELEASE_TAG"]
          event = os.environ["GITHUB_EVENT_NAME"]
          if event == "workflow_dispatch":
              tag = "v" + json.loads(pathlib.Path("app/src-tauri/tauri.conf.json").read_text())["version"]
          elif event != "push" or os.environ["GITHUB_REF_TYPE"] != "tag":
              raise SystemExit("Expected tag push or artifact-only manual run")
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag, re.ASCII):
              raise SystemExit("Expected stable vMAJOR.MINOR.PATCH tag")
          version = tag[1:]
          if any(int(part) > 65535 for part in version.split(".")):
              raise SystemExit("Version exceeds Windows installer component limit")
          def read_json(path):
              return json.loads(pathlib.Path(path).read_text())
          lock = read_json("app/ui/package-lock.json")
          cargo = tomllib.loads(pathlib.Path("app/src-tauri/Cargo.toml").read_text())
          cargo_lock = tomllib.loads(pathlib.Path("Cargo.lock").read_text())
          versions = [read_json("app/src-tauri/tauri.conf.json")["version"],
                      cargo["package"]["version"],
                      next(p["version"] for p in cargo_lock["package"] if p["name"] == "grooviq-app"),
                      read_json("app/ui/package.json")["version"],
                      lock["version"], lock["packages"][""]["version"]]
          if any(value != version for value in versions):
              raise SystemExit("Tag must match all app versions and lockfiles")
          PYTHON

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            extension: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            extension: exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - run: npm ci
        working-directory: app/ui
      - name: Verify dist golden renders
        shell: bash
        run: |
          set -euo pipefail
          unset GOLDEN_UPDATE SONG_M3_UPDATE
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          # Same triple as the installer, so the check covers the code generation that ships.
          cargo test -p grooviq-golden --profile dist --locked --target ${{ matrix.target }} 2>&1 | tee "$log"
          passed=$(awk '/^test result: ok\. [0-9]+ passed;/ { total += $4 } END { print total + 0 }' "$log")
          # song_m3 holds the only byte check of the production export path: exactly one summary.
          song=$(awk '/^ *(Running|Doc-tests) / { in_song = /^ *Running tests.song_m3\.rs / }
            in_song && /^test result: ok\. [0-9]+ passed;/ { n++; count = $4 }
            END { print (n == 1 ? count : "missing") }' "$log")
          # Validate before arithmetic: a malformed value inside `if (( ))` does not trip errexit.
          if ! [[ $passed =~ ^[0-9]+$ && $song =~ ^[0-9]+$ ]] || (( passed == 0 || song < 3 )); then
            echo "Dist golden tests passed: ${passed}, song_m3: ${song}; expected song_m3 >= 3." >&2
            exit 1
          fi
          echo "Dist golden tests passed: $passed (song_m3: $song)"
      # No signing secrets until #50. The CLI comes from the locked UI package.
      # No release inputs: build jobs cannot create or modify GitHub releases.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: app/src-tauri
          tauriScript: npm --prefix ../ui run tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked --profile dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.bundle }}
          path: target/${{ matrix.target }}/dist/bundle/${{ matrix.bundle }}/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - name: Attach both installers to a new draft only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg=(installers/*.dmg)
          exe=(installers/*.exe)
          [[ ${#dmg[@]} == 1 && ${#exe[@]} == 1 ]]
          # Never append assets to an existing (possibly public) release.
          # A rerun requires the owner to remove its previous draft first.
          ids=$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id')
          if [[ -n "$ids" ]]; then
            echo 'A release already exists for this tag; refusing to modify it.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${dmg[0]}" "${exe[0]}" \
            --verify-tag --draft --title "Grooviq $RELEASE_TAG" \
            --notes 'Unsigned preview builds. macOS signing and notarization and Windows signing are tracked in #50. Review both installers before manually publishing this draft.'
