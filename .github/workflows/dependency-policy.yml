name: dependency-policy
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: >-
    dependency-policy-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' ||
    (github.event_name == 'push' && github.ref == 'refs/heads/merge-train/batch') }}
jobs:
  rust-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Versioned upstream CLI; no floating installer or advisory exclusions.
      - run: cargo install cargo-deny --version 0.22.1 --locked
      - name: Record Rust licence inventory
        run: cargo metadata --locked --all-features --format-version 1 > rust-licenses.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: rust-licenses
          path: rust-licenses.json
      - run: cargo deny --locked check licenses
      - if: ${{ !cancelled() }}
        run: cargo deny --locked check advisories
  npm-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test scripts/dependency-policy/npm-policy.test.mjs
      - name: Record npm licence inventory
        run: node scripts/dependency-policy/npm-policy.mjs report > npm-licenses.md
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: npm-licenses
          path: npm-licenses.md
      - run: node scripts/dependency-policy/npm-policy.mjs licenses
      - if: ${{ !cancelled() }}
        run: node scripts/dependency-policy/npm-policy.mjs audit
