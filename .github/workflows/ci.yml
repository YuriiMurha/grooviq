name: ci

on:
  push:
    branches: [main, merge-train/batch]
  pull_request:

permissions:
  contents: read

concurrency:
  # Main pushes share one group without cancel-in-progress: a started run always finishes (rust-cache
  # saves only on main), and each newly queued run replaces the pending one in queue-arrival order, so
  # at most one runs and one waits (#693). A batch tip, even main's latest tree, may get no main run
  # until a later push. That is not a gap: its tested record is the merge-train/batch run on the same
  # tree plus the train's tree-equality check. PRs and merge-train/batch: per ref, cancel older.
  group: >-
    ci-${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' ||
    (github.event_name == 'push' && github.ref == 'refs/heads/merge-train/batch') }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.select.outputs.rust }}
      wasm: ${{ steps.select.outputs.wasm }}
      e2e: ${{ steps.select.outputs.e2e }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        id: select
        with:
          script: |
            const { selectJobs } = require('./scripts/ci-paths.cjs');
            const jobs = await selectJobs({
              eventName: context.eventName,
              pullRequest: context.payload.pull_request,
              repo: context.repo,
              rest: github.rest,
              paginate: github.paginate,
            });
            core.info(JSON.stringify(jobs));
            for (const [job, run] of Object.entries(jobs)) core.setOutput(job, run);

  # Explicit job names keep the required check contexts stable when skipped.
  rust-macos:
    name: rust (macos-latest)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps: &rust_steps
      - uses: actions/checkout@v5
      # rust-cache keys on Cargo.toml dependency sections only, so a [profile] change would reuse
      # dependencies built with the old profile and rebuild them on every PR. Key it on the root manifest.
      - name: Key the Rust cache on the root manifest
        shell: bash
        run: echo "RUST_CACHE_ROOT_MANIFEST=${{ hashFiles('Cargo.toml') }}" >> "$GITHUB_ENV"
      - run: rustup toolchain install
      - name: Create Windows Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 32GB
          drive-path: ${{ runner.temp }}/grooviq-dev-drive.vhdx
      # Keep Cargo and rust-cache on the workspace-relative target path.
      - name: Link the Cargo target to the Windows Dev Drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:DEV_DRIVE -notmatch '^[A-Za-z]:$') {
            throw "Expected a Dev Drive letter, got '$env:DEV_DRIVE'"
          }
          $driveTarget = "$env:DEV_DRIVE\target"
          New-Item -ItemType Directory -Path $driveTarget | Out-Null
          New-Item -ItemType Junction -Path target -Target $driveTarget | Out-Null
          node -e 'const fs = require("node:fs");
            const resolved = fs.realpathSync("target");
            if (resolved !== fs.realpathSync(process.env.DEV_DRIVE + "/target")) throw new Error(resolved);
            const entries = fs.readdirSync("target");
            console.log("Node read target via junction:", resolved, "entries:", entries.length);'
      # The Actions cache is over its 10 GB limit, and PR copies evict main's caches.
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          shared-key: ${{ runner.os == 'Windows' && 'rust-dev-drive' || 'rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' || (runner.os == 'Windows' && github.head_ref == 'ci/694-dev-drive-retry') }}
      - name: Verify restored Rust artifacts on the Windows Dev Drive
        if: runner.os == 'Windows' && steps.rust-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: >-
          node -e 'const fs = require("node:fs");
            const resolved = fs.realpathSync("target/debug/deps");
            if (resolved !== fs.realpathSync(process.env.DEV_DRIVE + "/target/debug/deps")) throw new Error(resolved);
            const libraries = fs.readdirSync(resolved).filter((file) => file.endsWith(".rlib"));
            if (!libraries.length) throw new Error("Cache restored no Rust dependency libraries");
            console.log("Restored Rust dependency libraries on Dev Drive:", libraries.length);'
      # `tauri-build` needs the built UI (`frontendDist`) to compile the app crate.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci
        working-directory: app/ui
      - run: npm run build
        working-directory: app/ui
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      - name: Run workspace tests
        id: nextest
        run: cargo nextest run --workspace --all-features --profile ci
      - name: Upload failed Rust test results
        if: failure() && steps.nextest.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-junit-${{ runner.os }}-${{ github.run_attempt }}
          path: target/nextest/ci/junit.xml
          retention-days: 7
      - name: Run workspace doctests
        run: cargo test --workspace --all-features --doc
      - name: Checked real Session replay
        run: node scripts/semantic-replay.mjs
      - name: Note-edit budget runner tests
        run: node --test scripts/notes-edit-budget.test.mjs
      - name: Optimized 10,000-note edit budget
        run: node scripts/notes-edit-budget.mjs

      - name: Optimized 8-second export budget
        run: node scripts/export-budget.mjs

  rust-windows:
    name: rust (windows-latest)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps: *rust_steps

  # The DSP crate is meant to also run in a browser; this keeps it compiling for the web.
  # Not a required check: it only has to stay green, and the `rust` jobs gate merging.
  dsp-wasm32:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.wasm != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p grooviq-dsp --target wasm32-unknown-unknown

  ui:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: Install Make for safety tests
        timeout-minutes: 2
        run: |
          apt-get -o Acquire::Retries=3 update -qq &&
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends make
      - name: Local refresh safety tests
        working-directory: .
        run: make test-refresh-app
      - name: Staged conflict safety tests
        working-directory: .
        run: make test-pre-commit
      - name: Merge train safety tests
        working-directory: .
        run: make test-merge-train
      - name: Merge train agent safety tests
        working-directory: .
        run: make test-merge-train-agent
      - name: Instruction capture safety tests
        working-directory: .
        timeout-minutes: 2
        run: make test-instruction-profiles
      - name: Private QA command tests
        working-directory: .
        run: make test-qa-driver
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - name: CI path selection tests
        run: node --test ../../scripts/ci-paths.test.cjs
      - name: E2e browser accounting safety tests
        run: node --test ../../scripts/e2e-browser-results.test.mjs
      - name: E2e diagnostic safety tests
        run: node --test ../../scripts/e2e-diagnostics.test.mjs
      - name: Runner acquisition retry tests
        run: node --test ../../scripts/rerun-no-runner.test.cjs
      - name: Real Session / mock semantic replay
        run: npm run e2e -- --config playwright.replay.config.ts --project chromium
      - name: Largest grid CPU budget
        run: node ../../scripts/grid-budget.mjs
      - run: npm run build

  # Not a required check: Playwright against the web build with the mock engine
  # (app/ui/e2e). WebKit stands in for the macOS app, Chromium for Windows' WebView2.
  e2e-browser:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        browser: [webkit, chromium]
        shard: [1, 2]
    runs-on: ubuntu-latest
    # Minutes per shard: 4 setup + 9 suite + 3 diagnostics + 1 container.
    timeout-minutes: 17
    container:
      # Keep this version equal to @playwright/test in app/ui/package-lock.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    defaults:
      run:
        working-directory: app/ui
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 1
      - uses: actions/setup-node@v5
        timeout-minutes: 1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci
        timeout-minutes: 2
      # Leave room for diagnostics; container initialization also uses the job budget.
      - name: Discover full inventory and run browser
        id: suite
        timeout-minutes: 9
        env:
          GROOVIQ_E2E_JSON: ${{ github.workspace }}/app/ui/browser-accounting/report.json
        run: |
          mkdir browser-accounting
          npm run --silent e2e -- --list --project=webkit --project=chromium --reporter=json > browser-accounting/inventory.json
          npm run e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2 --workers=2
      - name: Record external step outcome
        if: always()
        timeout-minutes: 1
        env:
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: |
          mkdir -p browser-accounting
          node ../../scripts/e2e-browser-results.mjs receipt browser-accounting ${{ matrix.browser }} ${{ matrix.shard }} 2
      - name: Upload browser accounting
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: e2e-accounting-${{ matrix.browser }}-${{ matrix.shard }}-of-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/ui/browser-accounting/receipt.json
          if-no-files-found: error
          retention-days: 7
      # Best effort on cancellation: a runner/job kill can still prevent delivery.
      - if: failure() || cancelled()
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.browser }}-${{ matrix.shard }}-of-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/ui/e2e-results
            app/ui/playwright-report/diagnostics-*
          retention-days: 7

  # Eight workers across four hosts, plus setup and aggregation cost.
  # A runner hard kill can prevent artifact delivery; absence must fail this gate.
  e2e:
    if: ${{ always() && !(needs.changes.outputs.e2e == 'false' && needs.e2e-browser.result == 'skipped') }}
    needs: [changes, e2e-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 1
      - uses: actions/setup-node@v5
        timeout-minutes: 1
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        timeout-minutes: 1
        with:
          name: e2e-accounting-webkit-1-of-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-accounting/webkit/1-of-2
      - uses: actions/download-artifact@v4
        timeout-minutes: 1
        with:
          name: e2e-accounting-webkit-2-of-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-accounting/webkit/2-of-2
      - uses: actions/download-artifact@v4
        timeout-minutes: 1
        with:
          name: e2e-accounting-chromium-1-of-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-accounting/chromium/1-of-2
      - uses: actions/download-artifact@v4
        timeout-minutes: 1
        with:
          name: e2e-accounting-chromium-2-of-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-accounting/chromium/2-of-2
      - name: Require both complete successful browser projects
        timeout-minutes: 1
        env:
          BROWSER_RESULT: ${{ needs.e2e-browser.result }}
        run: node scripts/e2e-browser-results.mjs aggregate browser-accounting
