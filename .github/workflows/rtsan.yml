name: rtsan

# RealtimeSanitizer over the engine's `no_alloc` tests: the real processor, behind a fake output
# device as the cpal callback drives it. Any allocation, free, lock, sleep, file or network
# access or other blocking call on that path fails the job with a stack trace. macOS only:
# RTSan has no Windows runtime, and the same tests keep `assert_no_alloc` on every platform.
# No suppressions: callback violations must fail the job.

on:
  push:
    branches: [main, merge-train/batch]
  pull_request:

permissions:
  contents: read

concurrency:
  group: >-
    rtsan-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' ||
    (github.event_name == 'push' && github.ref == 'refs/heads/merge-train/batch') }}

jobs:
  optional-inputs:
    name: Optional Rust inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.select.outputs.result }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
        timeout-minutes: 3
      - run: make optional-rust-policy-test
      - uses: actions/github-script@v8
        id: select
        with:
          script: |
            const { shouldRun } = require('./scripts/optional-rust-checks.cjs');
            return await shouldRun({
              workflow: 'rtsan',
              eventName: context.eventName,
              ref: context.ref,
              after: context.payload.after,
              pullRequest: context.payload.pull_request,
              repo: context.repo,
              rest: github.rest,
              paginate: github.paginate,
            });

  rtsan:
    needs: optional-inputs
    # A failed selector must retain coverage; only an explicit false skips work.
    if: ${{ always() && !cancelled() && needs.optional-inputs.outputs.run != 'false' }}
    name: rtsan (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # rust-cache keys on Cargo.toml dependency sections only, so a [profile] change would reuse
      # dependencies built with the old profile and rebuild them on every PR. Key it on the root manifest.
      - name: Key the Rust cache on the root manifest
        shell: bash
        run: echo "RUST_CACHE_ROOT_MANIFEST=${{ hashFiles('Cargo.toml') }}" >> "$GITHUB_ENV"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: rtsan
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The build downloads LLVM's prebuilt RTSan runtime (rtsan-standalone-sys, with curl).
      # Cargo is on PATH here, not in ~/.cargo/bin where the Makefile looks by default.
      - run: make rtsan CARGO=cargo

  loom:
    needs: optional-inputs
    # A failed selector must retain coverage; only an explicit false skips work.
    if: ${{ always() && !cancelled() && needs.optional-inputs.outputs.run != 'false' }}
    name: loom (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5
      - name: Key the Rust cache on the root manifest
        run: echo "RUST_CACHE_ROOT_MANIFEST=${{ hashFiles('Cargo.toml') }}" >> "$GITHUB_ENV"
      - name: Install ALSA headers
        timeout-minutes: 4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libasound2-dev
      - run: rustup toolchain install
        timeout-minutes: 3
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          key: loom
          workspaces: . -> target/loom
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run the worker protocol models
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          echo "Rust cache exact hit: ${CACHE_HIT:-false}"
          time make test-loom CARGO=cargo
