# Temporary diagnostic branch for PR #860. This workflow is not for merging.
name: '#860 Callgrind diagnostic'

on:
  workflow_dispatch:
    inputs:
      reviewed_workflow_sha:
        description: Full reviewed diagnostic branch commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  capture-860:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'YuriiMurha/grooviq' &&
      github.ref == 'refs/heads/diagnostic/860-drums-callgrind' &&
      github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CAPTURE_BASE: '21046d4dfd721b0ff1e1088c993745741d117872'
      CAPTURE_HEAD: 'f287f2e643f98ebcf68ed6d3651159c5f084fac2'
    steps:
      - name: Check reviewed commit and runner before checkout
        timeout-minutes: 1
        env:
          REVIEWED_WORKFLOW_SHA: ${{ inputs.reviewed_workflow_sha }}
        run: |
          if [[ ! "$REVIEWED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ||
                "$REVIEWED_WORKFLOW_SHA" != "$GITHUB_SHA" || "$RUNNER_ARCH" != X64 ]]; then
            echo 'Dispatch requires the reviewed diagnostic commit and an x64 runner.' >&2
            exit 1
          fi
      - uses: actions/checkout@v5
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Capture safety tests
        timeout-minutes: 2
        run: make test-instruction-profiles
      - name: Install Linux capture tools
        timeout-minutes: 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends valgrind libasound2-dev binutils
          rustup toolchain install 1.100.0 --profile minimal
      - name: Install the locked Gungraun runner
        timeout-minutes: 4
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'
        run: cargo +1.100.0 install gungraun-runner --version 0.20.0 --locked
      - name: Capture the two pinned revisions
        id: capture
        timeout-minutes: 17
        run: |
          cp scripts/capture-instruction-profiles.py "$RUNNER_TEMP/capture-860.py"
          git fetch --no-tags --depth=2 origin "$CAPTURE_BASE" "$CAPTURE_HEAD"
          python3 -B "$RUNNER_TEMP/capture-860.py" \
            --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/instruction-profiles-860" \
            --base "$CAPTURE_BASE" --head "$CAPTURE_HEAD"
      - uses: actions/upload-artifact@v4
        if: always() && steps.capture.outcome != 'skipped' && steps.capture.outcome != ''
        timeout-minutes: 1
        with:
          name: instruction-profiles-860-${{ github.run_id }}
          path: ${{ runner.temp }}/instruction-profiles-860/
          retention-days: 7
          if-no-files-found: warn
