name: perf

# Speed numbers for benchmark inputs, in each job's summary and as artifacts. Timings on shared
# runners are noisy, so they never fail a job; the render benchmark fails only when a scene's
# bits depend on the block size. Instruction counts are exact: that job fails when a benchmark
# runs more than 1 % more instructions than on the pull request's base. None of these jobs is
# a required check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      capture_only:
        description: 'Historical Linux profile capture only (trusted maintainer)'
        type: boolean
        default: false
      capture_base:
        description: 'Verified historical base, full SHA'
        type: string
        default: '014db45a96789bce99a27b1661d5a5204950ca6c'
      capture_head:
        description: 'Verified measured synthetic head, full SHA'
        type: string
        default: 'bab875e7063ca5cc3427f4fa54c4f4b698758ac7'

permissions:
  contents: read

concurrency:
  group: >-
    perf-${{ (github.event_name == 'workflow_dispatch' && github.run_id) || github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' ||
    (github.event_name == 'push' && github.ref == 'refs/heads/merge-train/batch') }}

jobs:
  optional-inputs:
    if: ${{ !inputs.capture_only }}
    name: Optional Rust inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.select.outputs.result }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
        timeout-minutes: 3
      - run: make optional-rust-policy-test
      - uses: actions/github-script@v8
        id: select
        with:
          script: |
            const { shouldRun } = require('./scripts/optional-rust-checks.cjs');
            return await shouldRun({
              workflow: 'perf',
              eventName: context.eventName,
              pullRequest: context.payload.pull_request,
              repo: context.repo,
              rest: github.rest,
              paginate: github.paginate,
            });

  bench:
    needs: optional-inputs
    # A failed selector must retain coverage; only an explicit false skips work.
    if: ${{ !inputs.capture_only && always() && !cancelled() && needs.optional-inputs.outputs.run != 'false' }}
    name: bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_NET_OFFLINE: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
        timeout-minutes: 3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
        timeout-minutes: 2
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 3
        with:
          key: bench
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Dependency fetch controls
        timeout-minutes: 1
        run: python -m unittest discover -s scripts -p test_perf_fetch.py -v
      - name: Fetch locked benchmark dependencies (infrastructure)
        timeout-minutes: 4
        run: python scripts/perf-fetch.py
      - name: Machine
        run: |
          case "$RUNNER_OS" in
            macOS) cpu=$(sysctl -n machdep.cpu.brand_string); cores=$(sysctl -n hw.ncpu) ;;
            Windows) cpu=$(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name"); cores=$NUMBER_OF_PROCESSORS ;;
            *) cpu=$(sed -n 's/^model name\s*: //p' /proc/cpuinfo | head -1); cores=$(nproc) ;;
          esac
          {
            echo "## $RUNNER_OS ($RUNNER_ARCH)"
            echo
            echo "$cpu, $cores logical cores, $(rustc --version). Shared runner: compare runs on the same runner class only."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p perf
      - name: Render speed and block times
        run: cargo bench --locked --offline -p grooviq-golden --bench render
        env:
          GROOVIQ_PERF_JSON: ${{ github.workspace }}/perf/render.json
      - name: DSP kernels
        run: |
          cargo bench --locked --offline -p grooviq-dsp --bench kernels | tee perf/kernels.txt
          {
            echo "### DSP kernels (divan): one 64-frame block"
            echo
            echo '```text'
            cat perf/kernels.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: perf-${{ matrix.os }}
          path: perf/

  # The same scene must render the same bits on every platform (the export rule).
  determinism:
    if: ${{ !inputs.capture_only && !cancelled() && needs.bench.result == 'success' }}
    name: determinism (macOS vs Windows)
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: perf-*
          path: perf
      - name: Compare the render hashes
        run: |
          python3 - <<'PY'
          import glob, json, os, sys
          runs = {}
          for path in sorted(glob.glob("perf/perf-*/render.json")):
              runs[path.split("/")[1].removeprefix("perf-")] = {
                  (r["scene"], r["block"]): r["hash"] for r in json.load(open(path))["results"]
              }
          if len(runs) < 2:
              sys.exit(f"expected results from two runners, got {sorted(runs)}")
          names = sorted(runs)
          keys = sorted(set().union(*runs.values()))
          lines = ["## Render hashes across platforms", "",
                   "| scene | block | " + " | ".join(names) + " | same |",
                   "|---|--:|" + "---|" * len(names) + "---|"]
          bad = 0
          for key in keys:
              hashes = [runs[n].get(key, "missing") for n in names]
              same = len(set(hashes)) == 1 and "missing" not in hashes
              bad += not same
              lines.append(f"| {key[0]} | {key[1]} | " + " | ".join(f"`{h}`" for h in hashes)
                           + f" | {'yes' if same else '**no**'} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          sys.exit(1 if bad else 0)
          PY

  instructions:
    needs: optional-inputs
    # A failed selector must retain coverage; only an explicit false skips work.
    if: ${{ !inputs.capture_only && always() && !cancelled() && needs.optional-inputs.outputs.run != 'false' }}
    name: instructions (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Key the Rust cache on the root manifest
        shell: bash
        run: echo "RUST_CACHE_ROOT_MANIFEST=${{ hashFiles('Cargo.toml') }}" >> "$GITHUB_ENV"
      - name: Valgrind and ALSA headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends valgrind libasound2-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: instructions
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Synth workload witnesses
        run: cargo test -p grooviq-golden --test synth_workload
      # The rust jobs never build this Linux-only code, so lint it here.
      - run: cargo clippy -p grooviq-golden --benches -- -D warnings
      # The runner must match the `gungraun` crate's version in Cargo.lock.
      - name: gungraun-runner
        run: |
          version=$(sed -n '/^name = "gungraun"$/{n;s/^version = "\(.*\)"$/\1/p;}' Cargo.lock)
          if [ "$(gungraun-runner --version 2>/dev/null | awk '{print $2}')" != "$version" ]; then
            cargo install gungraun-runner --version "$version" --locked
          fi
      - name: Baseline (the pull request's base)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          overlay=$(mktemp -d)
          paths=(tests/golden/benches/instructions.rs tests/golden/benches/support/synth_workload.rs tests/golden/benches/support/sampler_workload.rs)
          for path in "${paths[@]}"; do
            mkdir -p "$overlay/$(dirname "$path")"
            cp "$path" "$overlay/$path"
          done
          git checkout --quiet "$BASE_SHA"
          # Restore BASE's tracked files, remove only overlays absent from BASE, even on failure.
          cleanup() {
            for path in "${paths[@]}"; do
              if git cat-file -e "$BASE_SHA:$path" 2>/dev/null; then
                git restore --source="$BASE_SHA" -- "$path"
              else
                rm -f -- "$path"
              fi
            done
            git checkout --quiet "$HEAD_SHA"
            rm -rf -- "$overlay"
          }
          trap cleanup EXIT
          for path in "${paths[@]}"; do
            mkdir -p "$(dirname "$path")"
            cp "$overlay/$path" "$path"
          done
          if [ -f tests/golden/benches/instructions.rs ]; then
            cargo bench -p grooviq-golden --bench instructions -- --save-baseline=base
            echo "BASELINE=--baseline=base" >> "$GITHUB_ENV"
          else
            echo "The base has no instruction benchmarks yet: no comparison."
          fi
          cleanup
          trap - EXIT
      # BASELINE is set by the step above when there is one to compare with.
      - name: Instruction counts
        run: |
          # The default `run` shell is `bash -e` without pipefail: keep gungraun's exit code
          # (3 on a regression), not tee's.
          set -o pipefail
          status=0
          cargo bench -p grooviq-golden --bench instructions -- ${BASELINE:+"$BASELINE"} 2>&1 | tee instructions.txt || status=$?
          {
            echo "## Instruction counts (Callgrind)"
            echo
            if [ -n "$BASELINE" ]; then
              echo "Compared with the pull request's base; more than 1 % more instructions fails this job."
            else
              echo "No base to compare with."
            fi
            echo
            echo '```text'
            sed 's/\x1b\[[0-9;]*m//g' instructions.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  capture:
    if: github.event_name == 'workflow_dispatch' && inputs.capture_only
    name: historical profiles (Linux only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Instruction capture safety tests
        timeout-minutes: 2
        run: make test-instruction-profiles
      - name: Validate before provisioning or fetching selected revisions
        env:
          CAPTURE_BASE: ${{ inputs.capture_base }}
          CAPTURE_HEAD: ${{ inputs.capture_head }}
        run: |
          python3 - <<'PYTHON'
          import os
          if (os.environ['CAPTURE_BASE'], os.environ['CAPTURE_HEAD']) != (
              '014db45a96789bce99a27b1661d5a5204950ca6c',
              'bab875e7063ca5cc3427f4fa54c4f4b698758ac7'):
              raise SystemExit('only the verified first historical pair is supported')
          PYTHON
          cp scripts/capture-instruction-profiles.py "$RUNNER_TEMP/capture-instruction-profiles.py"
      # Keep the eight-minute setup budget, with a visible failure boundary per tool.
      - name: Refresh historical tool package indexes
        timeout-minutes: 2
        run: sudo apt-get update -qq
      - name: Install historical Valgrind and system tools
        timeout-minutes: 2
        run: sudo apt-get install -y -qq --no-install-recommends valgrind libasound2-dev binutils
      - name: Install historical Rust toolchain
        timeout-minutes: 1
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Install historical gungraun runner
        timeout-minutes: 3
        run: cargo +1.100.0 install gungraun-runner --version 0.20.0 --locked
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_INCREMENTAL: '0'
      - name: Fetch verified commits and capture once each
        timeout-minutes: 17
        env:
          CAPTURE_BASE: ${{ inputs.capture_base }}
          CAPTURE_HEAD: ${{ inputs.capture_head }}
        run: |
          git fetch --no-tags origin "$CAPTURE_BASE" "$CAPTURE_HEAD"
          python3 "$RUNNER_TEMP/capture-instruction-profiles.py" --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/instruction-profiles" --base "$CAPTURE_BASE" --head "$CAPTURE_HEAD"
      - uses: actions/upload-artifact@v4
        timeout-minutes: 1
        if: always()
        with:
          name: instruction-profiles-${{ github.run_id }}
          path: ${{ runner.temp }}/instruction-profiles/
          retention-days: 7
          if-no-files-found: warn
