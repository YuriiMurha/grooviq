[package]
name = "grooviq-golden"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Golden-render tests: reference scenes rendered offline and compared with stored WAV files"
publish = false

[lib]
name = "grooviq_golden"

[dependencies]
grooviq-dsp = { path = "../../dsp" }
grooviq-engine = { path = "../../engine" }
grooviq-project = { path = "../../project" }
hound = "3"
libm = "0.2"

# Render speed, block times and determinism of the reference scenes: `cargo bench -p
# grooviq-golden --bench render`.
[[bench]]
name = "render"
harness = false

# Instruction counts through Callgrind (Apache-2.0 OR MIT). Valgrind runs on Linux only.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun = "0.20.0"

[[bench]]
name = "instructions"
harness = false
